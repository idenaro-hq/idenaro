name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    # Pinned to 22.04: Wails v2 links against webkit2gtk-4.0, which Ubuntu
    # 24.04 ("ubuntu-latest") dropped in favor of webkit2gtk-4.1.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install UI build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 libgtk-3-dev libwebkit2gtk-4.0-dev pkg-config
          go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - run: make deps
      - run: make test
      - run: make build-all

      - name: Checksums
        run: |
          cd dist
          sha256sum * > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
